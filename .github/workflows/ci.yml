name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  build:
    name: Build, test, and runtime-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check and build
        run: ./gradlew --no-daemon clean check build
      - name: Runtime Mixin and command smoke
        shell: bash
        run: |
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          timeout 240s bash -o pipefail -c \
            'printf "atmons_spawn_controller policy easy_vote\natmons_spawn_controller status\natmons_spawn_controller policy stock\natmons_spawn_controller policy peaceful\natmons_spawn_controller status\nstop\n" | ./gradlew --no-daemon runServer'
          grep -F 'Runtime-loaded required Mixin target net.minecraft.world.level.NaturalSpawner' \
            run/server/logs/latest.log
          grep -F 'All the Mons spawn policy is now easy_vote' run/server/logs/latest.log
          grep -F 'All the Mons spawn policy is now stock' run/server/logs/latest.log
          grep -F 'policy=peaceful' run/server/logs/latest.log
          grep -F 'Stopping the server' run/server/logs/latest.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            build/reports/
            run/server/logs/latest.log
          if-no-files-found: ignore
      - name: Upload production mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: allthemons-spawn-controller
          path: |
            build/libs/allthemons-spawn-controller-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
